name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (if forcing a release)'
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install semantic-release plugins
        run: |
          pnpm add -D semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github conventional-changelog-conventionalcommits

      - name: Create semantic-release config
        run: |
          cat > .releaserc.json << 'EOF'
          {
            "branches": ["main"],
            "plugins": [
              ["@semantic-release/commit-analyzer", {
                "preset": "conventionalcommits",
                "releaseRules": [
                  {"type": "feat", "release": "minor"},
                  {"type": "fix", "release": "patch"},
                  {"type": "perf", "release": "patch"},
                  {"type": "refactor", "release": "patch"},
                  {"type": "docs", "scope": "README", "release": "patch"},
                  {"type": "style", "release": "patch"},
                  {"type": "chore", "release": false},
                  {"type": "ci", "release": false},
                  {"type": "test", "release": false},
                  {"breaking": true, "release": "major"}
                ]
              }],
              ["@semantic-release/release-notes-generator", {
                "preset": "conventionalcommits",
                "presetConfig": {
                  "types": [
                    {"type": "feat", "section": "Features", "hidden": false},
                    {"type": "fix", "section": "Bug Fixes", "hidden": false},
                    {"type": "perf", "section": "Performance Improvements", "hidden": false},
                    {"type": "refactor", "section": "Code Refactoring", "hidden": false},
                    {"type": "docs", "section": "Documentation", "hidden": false},
                    {"type": "style", "section": "Styles", "hidden": false},
                    {"type": "chore", "section": "Miscellaneous Chores", "hidden": true},
                    {"type": "ci", "section": "Continuous Integration", "hidden": true},
                    {"type": "test", "section": "Tests", "hidden": true}
                  ]
                }
              }],
              ["@semantic-release/changelog", {
                "changelogFile": "CHANGELOG.md",
                "changelogTitle": "# Changelog\n\nAll notable changes to this project will be documented in this file."
              }],
              ["@semantic-release/npm", {
                "npmPublish": false
              }],
              ["@semantic-release/git", {
                "assets": ["CHANGELOG.md", "package.json"],
                "message": "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
              }],
              ["@semantic-release/github", {
                "assets": [
                  {"path": ".next/**/*.js", "label": "Build artifacts"}
                ],
                "successComment": "This ${issue.pull_request ? 'pull request' : 'issue'} is included in version ${nextRelease.version}",
                "failTitle": "Release failed",
                "labels": ["released"]
              }]
            ]
          }
          EOF

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release

      - name: Release summary
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/v${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'

    steps:
      - name: Release notification
        run: |
          echo "New release v${{ needs.release.outputs.new_release_version }} has been published!"
          echo "View release at: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.release.outputs.new_release_version }}"

# Commit message format for semantic versioning:
#
# feat: add new feature (minor version bump)
# fix: fix a bug (patch version bump)
# perf: performance improvement (patch version bump)
# refactor: code refactoring (patch version bump)
# docs: documentation changes (patch version bump for README)
# style: code style changes (patch version bump)
# chore: maintenance tasks (no release)
# ci: CI/CD changes (no release)
# test: test changes (no release)
#
# Breaking changes:
# feat!: breaking feature (major version bump)
# fix!: breaking fix (major version bump)
# Or add BREAKING CHANGE in commit body
